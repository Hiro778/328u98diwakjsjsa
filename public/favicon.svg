<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2A5E" />
      <stop offset="100%" stop-color="#161F47" />
    </linearGradient>
  </defs>
  <!-- BisnisSehat Brand Container (Squircle) -->
  <rect width="64" height="64" rx="16" fill="url(#bsGradient)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />
  <!-- BisnisSehat "BS" Typography Monogram -->
